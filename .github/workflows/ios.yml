name: App nativa del iPhone

# Compila OpenAnimator para iPhone en una Mac de GitHub y deja el .ipa SIN FIRMAR (lo firma el usuario con su cuenta de
# Apple: Sideloadly, AltStore, etc.): como artefacto del run y en el pre-release "ios-latest".
# Antes corre la app en el simulador de iPhone con -OADiag: prueba el WebKit de iOS (Workers, WebCodecs, video, red)
# y deja el resultado como anotación del run.
on:
  push:
    paths: ['ios/**', 'src/**', 'app/**', 'scripts/build-iphone.mjs', 'vite.iphone.config.ts', 'package.json', 'package-lock.json', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26 # Xcode 26 y el simulador de iOS 26 (el JavaScript de Claude Code necesita el WebKit de iOS 26+)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Prueba de la reescritura de `using` (Claude Code en el WebKit de iOS)
        run: node --experimental-strip-types scripts/check-lower-using.mjs

      - name: Interfaz (ios/www)
        run: npm run build:ios

      - name: Xcode más nuevo y XcodeGen
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Simulador (diagnóstico del WebKit de iOS)
        continue-on-error: true
        run: |
          set -x
          xcodebuild -project ios/OpenAnimator.xcodeproj -scheme OpenAnimator -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO -quiet build
          APP=build/sim/Build/Products/Debug-iphonesimulator/OpenAnimator.app
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          for rt in sorted(d, reverse=True):
              if 'iOS' in rt:
                  for x in d[rt]:
                      if x['name'].startswith('iPhone'):
                          print(x['udid']); sys.exit()
          ")
          echo "$UDID" > udid.txt
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          # Lo que dicen WebKit y los medios del sistema mientras tanto (por qué no carga un <video>).
          xcrun simctl spawn "$UDID" log stream --style compact --level info \
            --predicate 'subsystem BEGINSWITH "com.apple.WebKit" OR subsystem BEGINSWITH "com.apple.coremedia" OR subsystem BEGINSWITH "com.apple.avfoundation" OR process CONTAINS "WebKit.GPU" OR process == "mediaserverd"' > wk.log 2>&1 &
          LOGPID=$!
          xcrun simctl launch --console-pty --terminate-running-process "$UDID" com.openanimator.app -OADiag > diag.log 2>&1 &
          PID=$!
          for i in $(seq 1 200); do grep -q "OA-DIAG-" diag.log && break; sleep 1; done
          sleep 1; kill $PID $LOGPID 2>/dev/null || true
          esc() { python3 -c "import sys; print(sys.stdin.read()[-12000:].replace('%','%25').replace('\r','').replace('\n','%0A'))"; }
          echo "::warning title=WebKit y medios (simulador)::$(grep -iE 'media|avf|player|video|audio|decod|fail|error' wk.log | tail -n 120 | cut -c1-300 | esc)"
          cat diag.log
          RESULT=$(grep -o 'OA-DIAG-RESULT .*' diag.log | head -1 | cut -c16-)
          echo "::notice title=Diagnóstico del simulador::${RESULT:-sin resultado (ver el log)}"
          { echo '### Diagnóstico del simulador'; echo '```json'; echo "${RESULT:-sin resultado}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # La app de verdad en el simulador: instala Claude Code de npm, lo arranca contra una API de mentira (en esta Mac),
      # Claude escribe una escena por MCP, se exporta un video y AVFoundation lo revisa (src/iphone/test/e2e.ts).
      - name: Simulador (prueba de punta a punta)
        continue-on-error: true
        run: |
          node ios/test/mock-anthropic.mjs 8899 > mock.log 2>&1 &
          UDID=$(cat udid.txt)
          xcrun simctl launch --console-pty --terminate-running-process "$UDID" com.openanimator.app -OATest e2e \
            -OADev '{"env":{"ANTHROPIC_BASE_URL":"http://127.0.0.1:8899","ANTHROPIC_API_KEY":"sk-ant-api03-prueba"}}' > e2e.log 2>&1 &
          PID=$!
          for i in $(seq 1 900); do grep -q "OA-DIAG-" e2e.log && break; sleep 1; done
          sleep 1; kill $PID 2>/dev/null || true
          cat e2e.log
          echo '--- API de mentira'; tail -n 60 mock.log
          RESULT=$(grep -o 'OA-DIAG-RESULT .*' e2e.log | head -1 | cut -c16-)
          echo "::notice title=Prueba de punta a punta::${RESULT:-sin resultado (ver el log)}"
          { echo '### Prueba de punta a punta'; echo '```json'; echo "${RESULT:-sin resultado}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # El final del registro (y de la API de mentira) como anotación: se lee sin entrar a los logs del run.
          esc() { python3 -c "import sys; print(sys.stdin.read()[-12000:].replace('%','%25').replace('\r','').replace('\n','%0A'))"; }
          echo "::warning title=Registro de la prueba::$(grep -v '^\[scheme\]' e2e.log | tail -n 80 | esc)"
          echo "::warning title=API de mentira::$(tail -n 30 mock.log | esc)"

      - name: IPA sin firmar
        run: |
          xcodebuild -project ios/OpenAnimator.xcodeproj -scheme OpenAnimator -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build/dev CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet build
          mkdir -p build/ipa/Payload
          cp -R build/dev/Build/Products/Release-iphoneos/OpenAnimator.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../OpenAnimator.ipa Payload)
          ls -la build/OpenAnimator.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OpenAnimator-iphone
          path: build/OpenAnimator.ipa
          if-no-files-found: error

      - name: Pre-release "ios-latest"
        if: github.ref_name == 'master' || github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest build/OpenAnimator.ipa --prerelease --target "$GITHUB_SHA" \
            --title "iPhone: última compilación" \
            --notes "OpenAnimator para iPhone, sin firmar (rama ${GITHUB_REF_NAME}, ${GITHUB_SHA::7}). Firmalo con tu cuenta de Apple (Sideloadly, AltStore…) e instalalo."
