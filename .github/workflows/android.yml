name: APK de Android

# Arma OpenAnimator para Android (tablets) y deja el APK como artefacto del run.
# En un release publicado, además lo adjunta al release.
on:
  push:
    branches: [main, master]
    paths: ['android/**', 'src/**', 'app/**', 'package.json', 'package-lock.json', 'vite.android.config.ts', 'tsconfig.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'src/**', 'app/**', 'package.json', 'package-lock.json', 'vite.android.config.ts', 'tsconfig.json', '.github/workflows/android.yml']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dependencias
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: SDK de Android (build-tools y plataforma 34)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: APK
        run: bash android/build-apk.sh
        env:
          OUT_APK: android/build/OpenAnimator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpenAnimator-android
          path: android/build/OpenAnimator.apk
          if-no-files-found: error

      - name: Adjuntar al release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" android/build/OpenAnimator.apk --clobber
