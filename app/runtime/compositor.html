<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OpenAnimator compositor</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; background: #000; transform-origin: 0 0; }
  .layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; display: none; background: transparent; }
  img.layer, video.layer { object-fit: contain; }
  #msg { position: absolute; left: 20px; bottom: 16px; color: #888; font: 14px system-ui; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="msg"></div>
<script src="compositor.js"></script>
</body>
</html>
