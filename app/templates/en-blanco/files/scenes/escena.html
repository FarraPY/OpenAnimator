<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>{{PROJECT_NAME}}</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101218; }
  /* Diseñá en 1920×1080: --u es 1 px de diseño y escala al tamaño real de la ventana. */
  :root { --u: min(100vw / 1920, 100vh / 1080); }
  #stage { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 1920); height: calc(var(--u) * 1080); transform: translate(-50%, -50%); }
  h1 { position: absolute; left: 0; right: 0; top: calc(var(--u) * 430); margin: 0; text-align: center; color: #fff;
       font: 800 calc(var(--u) * 130) 'Segoe UI', sans-serif; letter-spacing: calc(var(--u) * -3); }
  .bar { position: absolute; left: calc(var(--u) * 660); top: calc(var(--u) * 620); height: calc(var(--u) * 12); border-radius: 99px; background: #7c6cff; }
</style>
</head>
<body>
<div id="stage"><h1 id="titulo">{{PROJECT_NAME}}</h1><div class="bar" id="barra"></div></div>
<script>
/*
 * CONTRATO DE OPENANIMATOR
 * - Exponé window.__oa = { duration, render(t) }  (o async renderFrame(t)).
 * - render(t) debe ser una FUNCIÓN PURA del tiempo: mismo t → mismo cuadro, sin importar
 *   desde dónde se salte. Nada de Math.random / Date.now / estado entre cuadros.
 * - También funcionan animaciones CSS y requestAnimationFrame: OpenAnimator controla el reloj.
 */
var D = 8;
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function outCubic(u) { return 1 - Math.pow(1 - u, 3); }
function render(t) {
  var u = outCubic(clamp(t / 1.2, 0, 1));
  var h1 = document.getElementById('titulo');
  h1.style.opacity = u;
  h1.style.transform = 'translateY(' + (1 - u) * 60 + 'px)';
  var w = outCubic(clamp((t - 0.8) / 1.5, 0, 1)) * 600;
  document.getElementById('barra').style.width = 'calc(var(--u) * ' + w + ')';
  var out = 1 - clamp((t - (D - 0.8)) / 0.8, 0, 1);
  document.getElementById('stage').style.opacity = out;
}
window.__oa = { duration: D, render: render };
render(0);
</script>
</body>
</html>
