# Proyecto de Xcode de la app nativa del iPhone (lo genera XcodeGen: `xcodegen generate` en esta carpeta).
# Antes hay que armar la interfaz en ios/www con `npm run build:ios`.
name: OpenAnimator
options:
  bundleIdPrefix: com.openanimator
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  OpenAnimator:
    type: application
    platform: iOS
    sources:
      - path: OpenAnimator
        excludes: ["diag/**"]
      - path: OpenAnimator/diag
        type: folder
        buildPhase: resources
      - path: www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openanimator.app
        PRODUCT_NAME: OpenAnimator
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    info:
      path: OpenAnimator/Info.plist
      properties:
        CFBundleDisplayName: OpenAnimator
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIUserInterfaceStyle: Dark
        # 120 Hz en iPhone (sin esto CADisplayLink no pasa de 60): WebKit marca con él el ritmo de las vistas de captura.
        CADisableMinimumFrameDurationOnPhone: true
        # La carpeta de datos (proyectos, exportaciones) se ve en la app Archivos.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: Para guardar en Fotos los videos que exportás.
        NSPhotoLibraryUsageDescription: Para agregar tus fotos y videos a un proyecto.
        NSCameraUsageDescription: Para sacar una foto o grabar un video y usarlo en un proyecto.
        NSLocalNetworkUsageDescription: OpenAnimator manda el registro de depuración a tu computadora por la red wifi, sólo si lo activás en Ajustes › Depuración.
        NSMicrophoneUsageDescription: Para grabar audio y usarlo en un proyecto.
        ITSAppUsesNonExemptEncryption: false
        # Conexiones locales (pruebas con una API de mentira en la Mac del simulador; escenas que miran la red local).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
